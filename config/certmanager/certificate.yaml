# Self-signed Issuer used to mint the webhook server's serving certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
spec:
  selfSigned: {}
---
# The serving certificate presented by the webhook server. The dnsNames are rewritten by the
# replacements in config/default/kustomization.yaml to follow the webhook Service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: system
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
spec:
  dnsNames:
  # SERVICE_NAME and SERVICE_NAMESPACE are substituted by kustomize replacements.
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
