# This rule is not used by the project ztwim-oidc-shims itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to openshift.kemo.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
  name: clusteroidcshim-viewer-role
rules:
- apiGroups:
  - openshift.kemo.dev
  resources:
  - clusteroidcshims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openshift.kemo.dev
  resources:
  - clusteroidcshims/status
  verbs:
  - get
