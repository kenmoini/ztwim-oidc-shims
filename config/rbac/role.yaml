---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - pods
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oidcshim.kemo.dev
  resources:
  - clusteroidcshims
  - oidcshims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oidcshim.kemo.dev
  resources:
  - clusteroidcshims/finalizers
  - oidcshims/finalizers
  verbs:
  - update
- apiGroups:
  - oidcshim.kemo.dev
  resources:
  - clusteroidcshims/status
  - oidcshims/status
  verbs:
  - get
  - patch
  - update
