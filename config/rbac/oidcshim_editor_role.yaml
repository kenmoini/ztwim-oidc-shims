# This rule is not used by the project ztwim-oidc-shims itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the oidcshim.kemo.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
#
# SECURITY: granting edit rights on OIDCShim in a namespace is equivalent to granting
# pod-create rights there, because spec.helper.image and spec.helper.securityContext are
# injected into every pod the shim matches in that namespace.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
  name: oidcshim-editor-role
rules:
- apiGroups:
  - oidcshim.kemo.dev
  resources:
  - oidcshims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oidcshim.kemo.dev
  resources:
  - oidcshims/status
  verbs:
  - get
