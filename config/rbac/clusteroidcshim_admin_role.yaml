# This rule is not used by the project ztwim-oidc-shims itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over openshift.kemo.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
  name: clusteroidcshim-admin-role
rules:
- apiGroups:
  - openshift.kemo.dev
  resources:
  - clusteroidcshims
  verbs:
  - '*'
- apiGroups:
  - openshift.kemo.dev
  resources:
  - clusteroidcshims/status
  verbs:
  - get
