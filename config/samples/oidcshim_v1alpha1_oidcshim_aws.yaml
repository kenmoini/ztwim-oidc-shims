# AWS IAM Roles via OIDC federation (AssumeRoleWithWebIdentity) using a namespaced OIDCShim.
#
# Enrol with the annotation or label oidcshim.kemo.dev/shim: aws and set
#   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
# on the Pod, ServiceAccount or Namespace. The IAM OIDC identity provider must trust the
# SPIRE server's issuer and list "sts.amazonaws.com" as a client ID (audience).
#
# The token is written to the same path the EKS Pod Identity Webhook uses so any AWS SDK
# picks it up through AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN with no code changes.
apiVersion: oidcshim.kemo.dev/v1alpha1
kind: OIDCShim
metadata:
  labels:
    app.kubernetes.io/name: ztwim-oidc-shims
    app.kubernetes.io/managed-by: kustomize
  name: aws
spec:
  provider: aws
  selection:
    enrollment:
      namespaces: true
      serviceAccounts: true
      pods: true
  parameters:
    - name: roleArn
      valueFrom:
        annotation: eks.amazonaws.com/role-arn
      required: true
    - name: region
      valueFrom:
        annotation: eks.amazonaws.com/region
      default: us-east-1
  audience: sts.amazonaws.com
  token:
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    fileName: token
  inject:
    env:
      - name: AWS_ROLE_ARN
        value: "{{ .roleArn }}"
      - name: AWS_WEB_IDENTITY_TOKEN_FILE
        value: "{{ .tokenPath }}"
      - name: AWS_ROLE_SESSION_NAME
        value: "{{ .podNamespace }}-{{ .serviceAccountName }}"
      - name: AWS_DEFAULT_REGION
        value: "{{ .region }}"
      - name: AWS_REGION
        value: "{{ .region }}"
