name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The generated CRDs, RBAC and deepcopy code are committed; regenerate them and fail
      # if anything moved, so a marker change can never land without its manifest.
      - name: Verify generated manifests and code are up to date
        run: |
          make manifests generate
          git diff --exit-code

      # `make lint` downloads the GOLANGCI_LINT_VERSION pinned in the Makefile, so the
      # linter used in CI is exactly the one used locally.
      - name: Run linter
        run: make lint

      - name: Run unit tests
        run: make test

      # The OpenShift overlay must swap in the RHEL spiffe-helper image and drop
      # cert-manager entirely; both overlays must also still build.
      - name: Verify the kustomize overlays
        run: |
          make kustomize
          ./bin/kustomize build config/default > /dev/null
          ./bin/kustomize build config/openshift | grep -q 'spiffe-helper-rhel9'
          ! ./bin/kustomize build config/openshift | grep -q cert-manager

  e2e:
    name: E2E tests on Kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The e2e suite creates and deletes its own cluster via `make setup-test-e2e` /
      # `make cleanup-test-e2e`; this step only puts the kind binary on PATH.
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Verify kind installation
        run: kind version

      - name: Run e2e tests
        run: make test-e2e
        env:
          CONTAINER_TOOL: docker
